name: Update Chocolatey

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version'
        required: true
        default: 1.5.X

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  chocolatey:
    name: Deploy to chocolatey.org
    runs-on: windows-latest
    if: github.repository == 'OpenChrom/OpenChromChocolateyPackage'
    steps:
      - name: Clone Repository
        uses: actions/checkout@v5

      - name: Set Checksum
        id: checksum
        run: |
          filename="OpenChrom-${{ github.event.inputs.version }}-Lablicate-x64.zip"
          url="https://products.lablicate.com/openchrom/${{ github.event.inputs.version }}/openchrom-lablicate_win32.x86_64_${{ github.event.inputs.version }}.zip"
          curl -sSL "${url}" -o "${filename}"
          sha256=$(cat "${filename}" | sha256sum -)
          sed -i "s/{SHA256CHECKSUM}/${sha256:0:64}/g" "tools/chocolateyinstall.ps1"

      - name: Set Version
        id: version
        run: |
          echo "nuget=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          sed -i "s/{VERSION}/${{ github.event.inputs.version }}/g" "openchrom.nuspec"

      - name: Pack Release
        run: |
          choco pack openchrom.nuspec

      - name: Upload Release
        run: |
          choco push openchrom.${{ steps.version.outputs.nuget }}.nupkg -s https://push.chocolatey.org/ -k ${{ secrets.CHOCO_KEY }}
